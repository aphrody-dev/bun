[package]
name = "bun_runtime_js"
description = "bun_runtime's JS-visible APIs on bun_js: node:path, bun:test's diff, Blob, File, Bun.file, Bun.write."
version = "0.0.0"
edition = "2024"
publish = false
# A member of the Boa build's workspace, not of Bun's: Bun's root lockfile stays without Boa.
workspace = "../../packages/bun-boa"

[lib]
path = "lib.rs"

# The schemas this crate implements that are not in its directory: the JavaScriptCore build reads them too.
[package.metadata.bun-js]
bindings = ["../runtime/node/node_path.bind.ts", "../runtime/node/node_validators.bind.ts"]

[dependencies]
boa_engine = { path = "../boa/core/engine", features = ["annex-b", "intl_bundled", "experimental"] }
boa_gc = { path = "../boa/core/gc" }
boa_wintertc = { path = "../boa/core/wintertc" }
bstr = { version = "1", default-features = false, features = ["alloc"] }
bun_core = { path = "../bun_core" }
bun_http_types = { path = "../http_types" }
bun_js = { path = "../bun_js" }
bun_node_path = { path = "../node_path" }
bun_paths = { path = "../paths" }
bun_sys = { path = "../sys" }
bun_text_diff = { path = "../text_diff" }
const_format = "0.2"
getrandom = "0.4"
libc = "0.2"
