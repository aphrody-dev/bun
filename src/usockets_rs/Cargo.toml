[package]
name = "bun_usockets_rs"
description = "uSockets (packages/bun-usockets) in Rust for the Boa build: the us_* C ABI that bun_uws_sys declares, on epoll, with TLS clients on rustls."
version = "0.0.0"
edition = "2024"
publish = false
# A member of the Boa build's workspace, not of Bun's.
workspace = "../../packages/bun-boa"

[lib]
path = "lib.rs"

[dependencies]
bun_uws_sys = { path = "../uws_sys" }
libc = "0.2"
pki-types = { package = "rustls-pki-types", version = "1", features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.1.0-pre.0"
webpki-roots = "1"
