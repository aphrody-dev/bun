[package]
name = "bun_usockets_rs"
description = "uSockets (packages/bun-usockets) in Rust for the Boa build: the us_* C ABI that bun_uws_sys declares, on epoll."
version = "0.0.0"
edition = "2024"
publish = false
# A member of the Boa build's workspace, not of Bun's.
workspace = "../../packages/bun-boa"

[lib]
path = "lib.rs"

[dependencies]
bun_uws_sys = { path = "../uws_sys" }
libc = "0.2"
